name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-integrity:
    name: Release artifact integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify published Bradbury evidence
        run: python scripts/verify_release_artifact.py

  contract:
    name: Contract lint and direct tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Cache GenVM direct-test runner
        uses: actions/cache@v5
        with:
          path: ~/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz
          key: genvm-runners-v0.3.0-rc7-e218a185
      - name: Install pinned test tools
        run: python -m pip install -r requirements-ci.txt
      - name: Seed pinned GenVM runner bundle
        shell: bash
        run: |
          target="$HOME/.cache/gltest-direct/genvm-universal-v0.3.0-rc7.tar.xz"
          mkdir -p "$(dirname "$target")"
          if [ ! -f "$target" ]; then
            curl --fail --location --retry 3 \
              https://github.com/genlayerlabs/genvm/releases/download/v0.3.0-rc7/genvm-runners-all.tar.xz \
              --output "$target"
          fi
          echo "e218a1854214681560351051f76fe2b878545cf3409455ef372d57014a88ca67  $target" | sha256sum --check --strict
      - name: GenVM lint
        run: |
          genvm-lint check contracts/verdict_proof.py --json
          genvm-lint check contracts/evidence_escrow.py --json
      - name: Direct contract tests
        # Keep the direct-mode plugin, but do not initialize the network plugin.
        # Direct tests must never require an account private key.
        run: python -m pytest -p no:gltest tests/direct/ -v --tb=short

  frontend:
    name: Frontend audit, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Strict TypeScript check
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters -p tsconfig.json
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
