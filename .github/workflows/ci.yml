name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-integrity:
    name: Release artifact integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify published Bradbury evidence
        run: python scripts/verify_release_artifact.py

  contract:
    name: Contract lint and direct tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Cache GenVM direct-test runner
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: ${{ runner.os }}-gltest-direct-v0.2.12
      - name: Install pinned test tools
        run: python -m pip install -r requirements-ci.txt
      - name: GenVM lint
        run: genvm-lint check contracts/verdict_proof.py --json
      - name: Direct contract tests
        run: python -m pytest tests/direct/ -v --tb=short

  frontend:
    name: Frontend audit, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Strict TypeScript check
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters -p tsconfig.json
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build
