name: StudioNet Integration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studionet-integration
  cancel-in-progress: false

jobs:
  integration:
    name: Consensus integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned test tools
        run: python -m pip install -r requirements-ci.txt
      - name: Run StudioNet consensus tests
        run: gltest tests/integration/ -v -s --network studionet
